[project]
authors = [{name = "jfauchon", email = "jules.fauchon@gmail.com"}]
dependencies = [ "schrodinger>=0.1,<0.2"]
name = "TP_PIMS"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
tp_pims = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
numpy = ">=2.4.3,<3"
gudhi = ">=3.11.0,<4"
biopython = ">=1.86,<2"
tqdm = ">=4.67.3,<5"
pydicom = ">=3.0.2,<4"
ipykernel = ">=7.2.0,<8"
matplotlib = ">=3.10.8,<4"
pymol-open-source = ">=3.1.0,<4"
plotly = ">=6.6.0,<7"
nbformat = ">=5.10.4,<6"
